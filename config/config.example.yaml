# Portfolio-safe public config template.
# Copy to config/config.yaml and adjust values for your local run.

project_name: "portasql-demo"
database_path: "data/portasql_demo.db"
llm_model: "claude-sonnet-4-20250514"

sources:
  - name: "Bundled Demo Papers"
    connector: "demo"
    queries:
      - "transformer"
      - "robotics"
    max_results_per_query: 25

